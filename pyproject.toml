[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "datamind"
version = "0.1.0"
description = "开放式模型服务管理平台"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "bentoml>=1.4.39",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "concurrent-log-handler>=0.9.29",
    "minio>=7.2.0",
    "numpy>=1.26.0",
    "argon2-cffi>=25.1.0",
    "PyJWT[crypto]>=2.10.0",
    "starlette>=0.40.0",
    "python-multipart>=0.0.20",
]


[project.optional-dependencies]
sklearn = [
    "joblib>=1.3.0",
    "scikit-learn>=1.6.0",
    "optbinning>=0.21.0",
]

xgboost = [
    "xgboost>=2.0.0",
]

lightgbm = [
    "lightgbm>=4.0.0",
]

catboost = [
    "catboost>=1.2.0",
]

full = [
    "joblib>=1.3.0",
    "scikit-learn>=1.6.0",
    "optbinning>=0.21.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
]


[project.scripts]
datamind = "datamind.cli.main:app"


[tool.setuptools]
include-package-data = false


[tool.setuptools.cmdclass]
build_py = "build_commands.BuildPy"
sdist = "build_commands.Sdist"


[tool.setuptools.packages.find]
include = ["datamind*"]
exclude = ["datamind.console.static*", "datamind.console.dist*"]


[tool.setuptools.package-data]
"datamind.console" = ["dist/index.html", "dist/assets/*", "dist/.vite/manifest.json"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
]


[tool.ruff]
target-version = "py312"


[tool.ruff.lint]
select = ["E4", "E9", "F"]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
