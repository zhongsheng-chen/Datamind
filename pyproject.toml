[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "datamind"
version = "0.1.0"
description = "Datamind 模型部署平台"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "bentoml>=1.4.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "minio>=7.2.0",
    "numpy>=1.26.0",
]


[project.optional-dependencies]
sklearn = [
    "joblib>=1.3.0",
    "scikit-learn>=1.5.0",
]

xgboost = [
    "xgboost>=2.0.0",
]

lightgbm = [
    "lightgbm>=4.0.0",
]

catboost = [
    "catboost>=1.2.0",
]

full = [
    "joblib>=1.3.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
]


[project.scripts]
datamind = "datamind.cli.main:app"


[tool.setuptools.packages.find]
include = ["datamind*"]


[tool.pytest.ini_options]
pythonpath = ["."]