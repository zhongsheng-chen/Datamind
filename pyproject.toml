[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "build_support.backend"
backend-path = ["."]


[project]
name = "pydatamind"
version = "0.1.0"
description = "开放式模型服务管理平台"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Zhongsheng Chen", email = "zhongsheng.chen@bankgy.com.cn" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "bentoml>=1.4.39",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "concurrent-log-handler>=0.9.29",
    "minio>=7.2.0",
    "numpy>=1.26.0",
    "argon2-cffi>=25.1.0",
    "PyJWT[crypto]>=2.10.0",
    "starlette>=0.40.0",
    "python-multipart>=0.0.20",
    "celery[redis]>=5.6.0,<6.0.0",
    "kombu>=5.6.0,<6.0.0",
]


[project.optional-dependencies]
test = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

release = [
    "build>=1.2.0",
    "packaging>=24.0",
    "setuptools>=77.0.3",
    "twine>=6.2.0,<7.0.0",
    "wheel>=0.45.0",
]

sklearn = [
    "joblib>=1.3.0",
    "scikit-learn>=1.6.0",
    "optbinning>=1.0.0,<2.0.0",
]

xgboost = [
    "xgboost>=2.0.0",
]

lightgbm = [
    "lightgbm>=4.0.0",
]

catboost = [
    "catboost>=1.2.0",
]

full = [
    "joblib>=1.3.0",
    "scikit-learn>=1.6.0",
    "optbinning>=1.0.0,<2.0.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
]


[project.scripts]
datamind = "datamind.cli.main:app"


[project.urls]
Homepage = "https://github.com/zhongsheng-chen/Datamind"
Documentation = "https://github.com/zhongsheng-chen/Datamind#readme"
Source = "https://github.com/zhongsheng-chen/Datamind"


[tool.datamind.oci]
title = "Datamind"
vendor = "BANK OF GUIYANG CO., LTD."

[tool.datamind.docker]
repository = "docker.io/zhongshengchen/datamind"


[tool.setuptools]
include-package-data = false


[tool.setuptools.cmdclass]
build_py = "build_support.backend.commands.BuildPy"
sdist = "build_support.backend.commands.Sdist"


[tool.setuptools.packages.find]
include = ["datamind*"]
exclude = ["datamind.console.static*", "datamind.console.dist*"]


[tool.setuptools.package-data]
"datamind.console" = ["dist/index.html", "dist/assets/*", "dist/.vite/manifest.json"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
  python_classes = ["Test*"]
  python_functions = ["test_*"]
  norecursedirs = [".*", "__pycache__", "node_modules"]
  asyncio_mode = "auto"
addopts = [
    "-v",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: requires a real external infrastructure service",
    "e2e: exercises a complete backend or platform workflow",
    "framework: requires optional ML dependencies",
    "smoke: verifies installability and basic runtime availability",
]


[tool.coverage.run]
branch = true
source = ["datamind"]


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
target-version = "py312"


[tool.ruff.lint]
select = ["E4", "E9", "F", "D400"]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
