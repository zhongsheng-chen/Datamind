# Local documentation demo only. Replace credentials for any shared deployment.
name: datamind-docs-demo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datamind_docs
      POSTGRES_PASSWORD: datamind_docs_local
      POSTGRES_DB: datamind_docs
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamind_docs -d datamind_docs"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ghcr.io/zhongsheng-chen/redis:8.8.2-alpine3.23
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: datamind_docs
      MINIO_ROOT_PASSWORD: datamind_docs_local
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  minio-data:
