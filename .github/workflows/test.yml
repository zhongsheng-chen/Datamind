name: Tests

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - dev

jobs:
  quick-checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      DATAMIND_SERVICE_ENVIRONMENT: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python test dependencies
        run: pip install -e ".[test,release]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build console assets
        run: npm run build:console

      - name: Run Python quick checks
        run: >-
          pytest --color=no -ra -m "not framework"
          tests/unit tests/services tests/cli tests/console

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run Vitest
        if: matrix.python-version == '3.12'
        run: npm run test:frontend

  framework-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install framework test dependencies
        run: pip install -e ".[test,full]"

      - name: Run framework tests
        run: pytest --color=no -ra -m framework tests/unit

      - name: Verify installed dependencies
        run: python -m pip check

  framework-compatibility:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        framework:
          - sklearn
          - xgboost
          - lightgbm
          - catboost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install framework extra
        run: pip install -e ".[test,release,${{ matrix.framework }}]"

      - name: Verify framework compatibility
        run: python -m scripts.verify_framework ${{ matrix.framework }}

      - name: Verify installed dependencies
        run: python -m pip check

  package-compatibility:
    name: Package compatibility (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package test dependencies
        run: pip install -e ".[test,release]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build console assets
        run: |
          npm ci
          npm run build:console

      - name: Run package build tests
        run: pytest --color=no -ra tests/unit/build

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ghcr.io/zhongsheng-chen/postgres:17.11-alpine3.24@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_DB: datamind_test
          POSTGRES_USER: datamind_test
          POSTGRES_PASSWORD: datamind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datamind_test -d datamind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ghcr.io/zhongsheng-chen/redis:8.8.2-alpine3.23@sha256:e2c307e77bcaf306fa9e468bda845165a46c4c015ffd238fb3c92ae5d71d486f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: ghcr.io/zhongsheng-chen/minio:RELEASE.2025-09-07T16-13-09Z@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
        env:
          MINIO_ROOT_USER: datamind_test
          MINIO_ROOT_PASSWORD: datamind_test_secret
        ports:
          - 9000:9000
        command: server /data
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:9000/minio/health/ready"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATAMIND_SERVICE_ENVIRONMENT: testing
      DATAMIND_TEST_DATABASE_URL: postgresql+asyncpg://datamind_test:datamind_test@127.0.0.1:5432/datamind_test
      DATAMIND_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATAMIND_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
      DATAMIND_TEST_MINIO_ACCESS_KEY: datamind_test
      DATAMIND_TEST_MINIO_SECRET_KEY: datamind_test_secret
      DATAMIND_TEST_MINIO_BUCKET: datamind-integration-test
      DATAMIND_TEST_MINIO_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integration dependencies
        run: pip install -e ".[test,full]"

      - name: Run integration tests
        run: pytest --color=no -ra -m integration

  backend-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ghcr.io/zhongsheng-chen/postgres:17.11-alpine3.24@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_DB: datamind_test
          POSTGRES_USER: datamind_test
          POSTGRES_PASSWORD: datamind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datamind_test -d datamind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATAMIND_SERVICE_ENVIRONMENT: testing
      DATAMIND_TEST_DATABASE_URL: postgresql+asyncpg://datamind_test:datamind_test@127.0.0.1:5432/datamind_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend E2E dependencies
        run: pip install -e ".[test,full]"

      - name: Run backend E2E tests
        run: pytest --color=no -ra tests/e2e
