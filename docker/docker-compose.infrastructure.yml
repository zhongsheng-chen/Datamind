name: datamind
services:
  postgres:
    image: ghcr.io/zhongsheng-chen/postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: datamind
      POSTGRES_PASSWORD: datamind
      POSTGRES_DB: datamind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamind -d datamind"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ghcr.io/zhongsheng-chen/redis:8.8.2-alpine3.23
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: ghcr.io/zhongsheng-chen/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: datamind
      MINIO_ROOT_PASSWORD: datamind
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  minio-data:
