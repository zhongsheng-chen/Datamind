name: datamind
services:
  postgres:
    image: ghcr.io/zhongsheng-chen/postgres:17.11-alpine3.24
    env_file:
      - .env.infrastructure
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  redis:
    image: ghcr.io/zhongsheng-chen/redis:8.8.2-alpine3.23
    env_file:
      - .env.infrastructure
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  minio:
    image: ghcr.io/zhongsheng-chen/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - .env.infrastructure
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default:
    name: datamind
