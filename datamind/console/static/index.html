<!doctype html>
<html lang="zh-CN" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Datamind 管理控制台</title>
  <meta name="description" content="开放式模型服务管理平台，连接模型交付与生产服务，让模型注册、版本管理、部署上线、API 调用、实验评估与审计追踪更加简单可靠。">
  <link rel="stylesheet" href="./assets/style.css?v=20260903-1">
  <script type="module" src="./assets/app.js?v=20260903-4"></script>
</head>
<body>
  <div id="login-view" class="login-shell">
    <section class="login-intro" aria-label="产品介绍">
      <div class="brand brand-light">
        <span class="brand-mark">DM</span>
        <span>DATAMIND</span>
      </div>
      <div class="intro-copy">
        <h1>让服务的每一次变化，都清晰可见。</h1>
        <div class="intro-benefits" aria-label="产品价值">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 14.5 9.5 9l4 4L20 6.5" />
              <path d="M14 6.5h6v6" />
            </svg>
            更快上线
          </span>
          <span class="intro-benefit-divider" aria-hidden="true"></span>
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5 19 6v5.5c0 4.4-2.8 7.3-7 9-4.2-1.7-7-4.6-7-9V6l7-2.5Z" />
              <path d="m9 12 2 2 4-4" />
            </svg>
            更稳运行
          </span>
        </div>
      </div>
    </section>

    <main class="login-panel">
      <form id="login-form" class="login-card">
        <div>
          <h2>登录控制台</h2>
          <p class="muted">使用本地账户登录。</p>
        </div>

        <label>
          <span>用户名</span>
          <input id="username" name="username" type="text" autocomplete="username" maxlength="64" required autofocus>
        </label>

        <label>
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
        </label>

        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="login-button" class="primary-button" type="submit">登录</button>
        <div class="login-meta">
          <p class="security-note">登录信息仅用于当前会话验证，不会保存在浏览器脚本中。</p>
          <p class="login-credit">Powered by <span>Zhongsheng Chen</span></p>
        </div>
      </form>
    </main>
  </div>

  <div id="dashboard-view" class="dashboard" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">DM</span>
        <span>DATAMIND</span>
      </div>
      <nav id="navigation" class="navigation" aria-label="控制台导航"></nav>
      <div class="sidebar-footer">
        <button id="console-home-button" class="console-home-button" type="button" aria-label="返回控制台首页">
          <span class="pulse-dot"></span>
          <span>控制台</span>
        </button>
        <span class="sr-only auto-refresh-status" aria-live="polite">
          <span id="realtime-status">正在建立实时连接</span>
          <span>，最近更新时间</span>
          <strong id="snapshot-time">-</strong>
        </span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" class="icon-button menu-button" type="button" aria-label="打开导航">☰</button>
        <div class="page-heading">
          <h1 id="page-title">概览</h1>
        </div>
        <div class="topbar-actions">
          <span id="service-environment" class="service-environment topbar-environment" role="status">-</span>
          <div class="account">
            <button
              id="account-menu-button"
              class="account-trigger"
              type="button"
              aria-label="打开账户菜单"
              aria-expanded="false"
              aria-controls="account-menu"
            >
              <span id="account-avatar" class="account-avatar" aria-hidden="true">-</span>
              <span id="account-name" class="account-name">-</span>
              <svg class="account-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 10 4 4 4-4" />
              </svg>
            </button>
            <div id="account-menu" class="account-menu" hidden>
              <div class="account-menu-profile">
                <strong id="account-menu-name">-</strong>
                <span id="account-menu-username">-</span>
              </div>
              <div class="account-menu-roles">
                <span>角色</span>
                <div id="account-role-list"></div>
              </div>
              <div class="account-security">
                <span>账户安全</span>
                <button id="change-password-button" type="button">修改密码</button>
              </div>
              <div id="account-management" class="account-management" hidden>
                <span>访问管理</span>
                <button type="button" data-account-section="users">用户管理</button>
                <button type="button" data-account-section="roles">角色管理</button>
              </div>
              <button id="logout-button" class="account-logout" type="button">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content">
        <section id="summary-grid" class="overview-metrics" aria-label="API 调用核心指标"></section>

        <section id="request-trend" class="trend-panel" hidden>
          <div class="trend-heading">
            <div>
              <h2>API 调用趋势</h2>
              <p id="trend-range-description">最近 24 小时 · 每 5 分钟聚合</p>
            </div>
            <div class="trend-heading-aside">
              <div id="trend-range-selector" class="trend-range-selector" role="group" aria-label="API 调用趋势时间范围">
                <button type="button" data-trend-range="1h" aria-pressed="false">1 小时</button>
                <button class="active" type="button" data-trend-range="24h" aria-pressed="true">24 小时</button>
                <button type="button" data-trend-range="7d" aria-pressed="false">7 天</button>
                <button type="button" data-trend-range="30d" aria-pressed="false">30 天</button>
              </div>
              <div class="trend-legend" aria-label="图例">
                <div class="trend-legend-item">
                  <i class="volume"></i>
                  <span>调用量</span>
                  <strong id="trend-volume-total">—</strong>
                </div>
                <div class="trend-legend-item">
                  <i class="error-rate"></i>
                  <span>失败率</span>
                  <strong id="trend-failure-rate">—</strong>
                </div>
              </div>
            </div>
          </div>
          <div id="request-trend-chart" class="trend-chart" aria-label="API 调用量与失败率趋势图"></div>
        </section>

        <section id="model-usage" class="model-usage-overview" hidden>
          <div class="model-usage-grid">
            <article class="model-usage-panel model-usage-recent">
              <div class="model-usage-section-heading">
                <h2>近 24 小时模型调用</h2>
                <p>调用量、成功率、平均耗时与流量占比</p>
              </div>
              <div id="recent-model-usage" class="model-usage-content"></div>
            </article>
            <article class="model-usage-panel model-usage-total">
              <div class="model-usage-section-heading">
                <h2>累计调用排行</h2>
                <p>各模型的历史调用规模</p>
              </div>
              <div id="total-model-usage" class="model-usage-ranking"></div>
            </article>
          </div>
        </section>

        <section class="data-panel">
          <div class="panel-heading">
            <div class="panel-heading-main">
              <div>
                <h2 id="section-title">最近记录</h2>
                <p id="section-caption" class="section-caption" hidden></p>
              </div>
              <button id="create-button" class="primary-button" type="button" hidden>创建</button>
            </div>
          </div>
          <div class="panel-actions">
            <button id="search-toggle-button" class="secondary-button search-toggle-button" type="button" aria-expanded="false" aria-controls="search-form">
              <span class="search-toggle-icon" aria-hidden="true"></span>
              <span>查询</span>
              <span class="search-active-label">已筛选</span>
            </button>
            <form id="search-form" class="search-form" role="search" hidden>
              <input id="search-input" type="search" maxlength="100" placeholder="输入关键词查询" aria-label="查询关键词">
              <button class="secondary-button" type="submit">应用</button>
              <button id="clear-search-button" class="text-button" type="button" hidden>清除</button>
              <button id="collapse-search-button" class="text-button search-collapse-button" type="button">收起</button>
            </form>
            <button id="resource-view-toggle" class="secondary-button resource-view-toggle" type="button" hidden>回收站</button>
            <button id="back-button" class="secondary-button" type="button" hidden>返回模型</button>
            <span id="selection-summary" class="selection-summary" hidden>
              <span id="selection-count"></span>
              <button id="selected-export-button" class="text-button" type="button" hidden>下载已选</button>
              <button id="clear-selection-button" class="text-button" type="button">清除选择</button>
            </span>
          </div>
          <div id="table-container" class="table-container"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
